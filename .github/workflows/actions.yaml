name: .NET CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # Use the SDK version your project targets (change if you’re on 6/7)
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore BizApp.sln

      - name: Build
        run: dotnet build BizApp.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test BizApp.Tests/BizApp.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=test_results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
